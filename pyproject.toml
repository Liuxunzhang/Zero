[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero"
version = "0.1.0"
description = "Web UI for Volatility 3 and YARA-X memory forensics"
readme = "README.md"
# 3.10+: runtime-evaluated `X | Y` annotations (e.g. ai_service._normalize_int_or_max)
# and builtin generics inside pydantic models (symbol_routes.DownloadSymbolsRequest).
requires-python = ">=3.10"
# Keep in sync with requirements.txt, which `make install` feeds to uv.
dependencies = [
    "volatility3>=2.5.0",
    "requests>=2.28.0",
    "yara-python>3.8.0",
    "yara-x==1.19.0",
    "python-multipart>=0.0.9",
    "jsonschema>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
    "openai>=2.46,<3",
    "anthropic>=0.117,<1",
    "google-genai>=2.13,<3",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["zero*", "web*"]
exclude = ["pi*", "tests*", "plugins*", "dev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Without this, `ruff check .` reports ~500 findings that are almost entirely
# typing-modernization suggestions (List -> list) across untouched files, which
# makes the command useless as a signal. Scoped to real defects instead.
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "web/frontend", "volatility3"]

[tool.ruff.lint]
# E9/F: syntax errors and undefined/unused names. B: likely bugs.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() defaults are the documented style
    "B904",  # bare `raise ValueError(...)` inside except is used throughout
]

[tool.ruff.lint.per-file-ignores]
# These modules import volatility3 submodules inside try/except purely to probe
# availability (VOLATILITY_AVAILABLE); the names are intentionally unused.
"zero/core/wrapper.py" = ["F401"]
"zero/engines/vol3_engine.py" = ["F401"]
# Imports must follow the sys.path bootstrap that makes `zero.*` importable.
"web/backend/main.py" = ["E402"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
